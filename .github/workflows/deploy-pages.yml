name: Deploy to GitHub Pages

# 수동 실행 전용.
# (참고: Settings → Pages → Source 를 "GitHub Actions"로 먼저 켠 뒤 실행해야 성공합니다.
#  Pages 최초 활성화 권한은 워크플로우 토큰에 없어서, 소유자가 한 번 켜줘야 합니다.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행 (진행 중인 배포는 취소하지 않고 큐잉)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages가 아직 켜져 있지 않아도 자동으로 활성화(enablement: true)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
